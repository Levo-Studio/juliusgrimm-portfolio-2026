name: Build and Push

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: levo-studio/juliusgrimm-portfolio-2026
  # Scaleway Container Registry (Amsterdam, privat)
  SCW_REGISTRY: rg.nl-ams.scw.cloud
  SCW_IMAGE_NAME: levo-studio/juliusgrimm-portfolio-2026
  SCW_REGION: nl-ams

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_IMAGE_NAME }}
          tags: |
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify pushed image digest
        run: |
          for IMAGE in "${REGISTRY}/${IMAGE_NAME}" "${SCW_REGISTRY}/${SCW_IMAGE_NAME}"; do
            docker buildx imagetools inspect "${IMAGE}@${{ steps.build.outputs.digest }}" >/dev/null
            echo "pushed image digest is available: ${IMAGE}@${{ steps.build.outputs.digest }}"
          done

      - name: Verify latest image revision
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:latest"
          docker pull "$IMAGE"
          REVISION="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"

          if [ "$REVISION" != "$GITHUB_SHA" ]; then
            echo "latest points to $REVISION, expected $GITHUB_SHA"
            exit 1
          fi

          echo "latest points to $REVISION"

      # Scaleway: Container auf das neue Image umstellen. Läuft erst, wenn die
      # Repository-Variable SCW_CONTAINER_ID gesetzt ist (nach Anlegen des Containers).
      - name: Deploy to Scaleway Serverless Containers
        if: ${{ vars.SCW_CONTAINER_ID != '' }}
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
          NEW_IMAGE: ${{ env.SCW_REGISTRY }}/${{ env.SCW_IMAGE_NAME }}:build-${{ github.run_number }}
        run: |
          set -euo pipefail
          API="https://api.scaleway.com/containers/v1/regions/${SCW_REGION}/containers/${SCW_CONTAINER_ID}"

          echo "Updating container to ${NEW_IMAGE} ..."
          curl --fail-with-body --silent --show-error -X PATCH "$API" \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" -H "Content-Type: application/json" \
            -d "{\"image\": \"${NEW_IMAGE}\"}" >/dev/null

          sleep 10
          for i in $(seq 1 60); do
            BODY="$(curl --fail --silent --show-error "$API" -H "X-Auth-Token: ${SCW_SECRET_KEY}")"
            STATUS="$(echo "$BODY" | jq -r '.status')"
            IMAGE="$(echo "$BODY" | jq -r '.image')"
            echo "status: ${STATUS}"
            if [ "$STATUS" = "ready" ] && [ "$IMAGE" = "$NEW_IMAGE" ]; then
              echo "Deployment completed: ${IMAGE}"; exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              echo "Deployment failed – see Scaleway console logs."; exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deployment."; exit 1
