# pnpm 11+ no longer reads the "pnpm" field of package.json; settings live here.

# Install scripts stay disabled for these packages (pnpm >= 11 fails the install on
# unreviewed build scripts). None needs one: esbuild, sharp and unrs-resolver (pulled in
# by eslint-config-next) ship prebuilt platform binaries as optional dependencies, which
# is how esbuild and sharp already ran under pnpm 10.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
